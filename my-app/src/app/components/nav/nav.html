<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" routerLink="/books">Redriver Test</a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/books" routerLinkActive="active">
            <fa-icon [icon]="faBook"></fa-icon> Books
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/quotes" routerLinkActive="active">
            <fa-icon [icon]="faQuoteLeft"></fa-icon> My Quotes
          </a>
        </li>
      </ul>

      <ul class="navbar-nav">
        @if (isLoggedIn) {
          <li class="nav-item">
            <button class="btn btn-link nav-link" (click)="logout()">
              <fa-icon [icon]="faLogout"></fa-icon> Logout
            </button>
          </li>
        } @else {
          <li class="nav-item">
            <a class="nav-link" routerLink="/login">
              <fa-icon [icon]="faLogin"></fa-icon> Login
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register">
              <fa-icon [icon]="faRegister"></fa-icon> Register
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>
