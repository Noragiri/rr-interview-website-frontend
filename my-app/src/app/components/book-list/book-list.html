<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Books</h1>
    @if (isLoggedIn) {
      <a routerLink="/books/new" class="btn btn-primary">
        <fa-icon [icon]="faPlus"></fa-icon> Add New Book
      </a>
    }
  </div>

  @if (books.length === 0) {
    <p class="text-muted">No books yet. Add one to get started.</p>
  }

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    @for (book of books; track book.id) {
      <div class="col">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ book.title }}</h5>
            <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
            <p class="card-text">
              <small class="text-muted">{{ book.publishedDate | date }}</small>
            </p>
          </div>
          @if (isLoggedIn) {
            <div class="card-footer bg-transparent d-flex justify-content-end gap-2">
              <a [routerLink]="['/books/edit', book.id]" class="btn btn-sm btn-outline-secondary">
                <fa-icon [icon]="faEdit"></fa-icon> Edit
              </a>
              <button (click)="onDelete(book.id)" class="btn btn-sm btn-outline-danger">
                <fa-icon [icon]="faTrash"></fa-icon> Delete
              </button>
            </div>
          }
        </div>
      </div>
    }
  </div>
</div>
