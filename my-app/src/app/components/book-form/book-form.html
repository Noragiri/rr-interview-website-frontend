<div class="container mt-4">
  <h1>{{ isEditMode ? 'Edit Book' : 'Add New Book' }}</h1>

  <form (ngSubmit)="onSubmit()" #bookForm="ngForm">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input
        type="text"
        id="title"
        name="title"
        class="form-control"
        [(ngModel)]="title"
        required
      />
    </div>

    <div class="mb-3">
      <label for="author" class="form-label">Author</label>
      <input
        type="text"
        id="author"
        name="author"
        class="form-control"
        [(ngModel)]="author"
        required
      />
    </div>

    <div class="mb-3">
      <label for="publishedDate" class="form-label">Published Date</label>
      <input
        type="date"
        id="publishedDate"
        name="publishedDate"
        class="form-control"
        [(ngModel)]="publishedDate"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!bookForm.valid">
      Submit
    </button>
  </form>
</div>
