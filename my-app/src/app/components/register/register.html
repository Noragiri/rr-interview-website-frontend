<div class="container mt-4" style="max-width: 400px">
  <h1>{{ languageService.t('register') }}</h1>

  @if (errorMessage) {
    <div class="alert alert-danger">{{ errorMessage }}</div>
  }

  @if (successMessage) {
    <div class="alert alert-success">{{ successMessage }}</div>
  }

  <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
    <div class="mb-3">
      <label for="username" class="form-label">{{ languageService.t('username') }}</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        [(ngModel)]="username"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">{{ languageService.t('password') }}</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        [(ngModel)]="password"
        required
        minlength="6"
      />
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!registerForm.valid">
      {{ languageService.t('register') }}
    </button>
  </form>

  <p class="mt-3">
    {{ languageService.t('alreadyHaveAccount') }}
    <a routerLink="/login">{{ languageService.t('loginHere') }}</a>
  </p>
</div>
